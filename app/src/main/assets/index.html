<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<!-- Without this the browser may auto-darken the page, and this design cannot
     survive it: the background is cream and the D-pad buttons are near-black,
     so force-dark collapses both to the same shade and the remote turns into
     light triangles floating on nothing. Opt out explicitly. -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F6F6F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BoxHub</title>
<style>
  :root{
    color-scheme: light;      /* see the <meta> above: never auto-darken */
    --bg:#F6F6F4;
    --surface:#FFFFFF;
    --surface-2:#FBFBFA;
    --line:#E5E3DE;
    --line-2:#D5D2CB;
    --ink:#171614;
    --ink-2:#57544D;
    --ink-3:#8C8880;
    --accent:#1F6F4A;
    --accent-soft:#EAF2EE;
    --warn:#B45309;
    --danger:#9F1239;
    --r:14px;
    --r-sm:10px;
    --shadow:0 1px 2px rgba(23,22,20,.05);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font-family:inherit;font-size:16px}
  a{color:var(--accent)}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;background:rgba(246,246,244,.92);
    backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    display:flex;align-items:center;gap:12px;
  }
  .mark{font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase}
  .dev{font-size:13px;color:var(--ink-2);margin-left:auto;text-align:right;line-height:1.25}
  .dev b{display:block;font-weight:600;color:var(--ink);font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
  .dot.on{background:var(--accent)}
  .dot.off{background:var(--danger)}

  /* ---------- layout ---------- */
  main{padding:0 18px calc(env(safe-area-inset-bottom) + 56px);max-width:820px;margin:0 auto}
  section{padding:28px 0 4px}
  section + section{border-top:1px solid var(--line)}
  .head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
  .head h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
  .head .sub{margin-left:auto;font-size:12px;color:var(--ink-3);font-family:var(--mono)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* ---------- screen preview ---------- */
  .screen{position:relative;width:100%;aspect-ratio:16/9;background:#111;overflow:hidden;border-radius:var(--r-sm)}
  .screen img{width:100%;height:100%;object-fit:contain;display:block}
  .screen .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#8A8781;font-size:13px;text-align:center;padding:20px;letter-spacing:.02em}
  .screen .age{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;
    font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px}
  .screenbar{display:flex;align-items:center;gap:8px;margin-top:10px}
  .screenbar .hint{font-size:12px;color:var(--ink-3);margin-left:auto;font-family:var(--mono)}
  .note{margin-top:10px;padding:11px 13px;border:1px solid var(--line-2);
    border-radius:var(--r-sm);background:#FDF4EC;color:#7A4A16;font-size:12.5px;line-height:1.65}
  .note b{font-weight:600}

  /* ---------- dpad ---------- */
  .dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
  .k{
    height:62px;border-radius:var(--r-sm);background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:.1em;
    transition:transform .07s ease,opacity .12s ease;user-select:none
  }
  .k:active{transform:scale(.94);opacity:.82}
  .k.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);font-size:13px;letter-spacing:.04em;font-weight:500}
  .k.ok{background:var(--accent);font-size:11px}
  .k svg{display:block}

  .rows{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px}
  .row .k{flex:1}

  /* ---------- touchpad ---------- */
  .pad{
    position:relative;height:170px;border:1px dashed var(--line-2);border-radius:var(--r-sm);
    background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    touch-action:none;overflow:hidden;user-select:none
  }
  .pad .tip{font-size:12px;color:var(--ink-3);text-align:center;padding:0 20px;pointer-events:none}
  .pad .nub{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ink);opacity:.16;pointer-events:none;display:none}

  /* ---------- text input ---------- */
  .inline{display:flex;gap:8px;margin-top:10px}
  .inline input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:13px 14px;color:var(--ink);outline:none}
  .inline input:focus{border-color:var(--line-2)}
  .btn{background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:13px 18px;font-size:14px;font-weight:600;letter-spacing:.04em}
  .btn:active{transform:scale(.98)}
  .btn.quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);font-weight:500}

  /* ---------- files ---------- */
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:12px}
  .crumbs button{padding:4px 6px;border-radius:6px;color:var(--ink-2);font-size:12px;font-family:var(--mono)}
  .crumbs button:active{background:var(--surface)}
  .crumbs .sepc{color:var(--line-2)}
  .crumbs .cur{color:var(--ink);font-weight:600}

  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tools .btn{padding:10px 14px;font-size:13px}
  .tools .spacer{flex:1}

  .drop{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:18px;text-align:center;
    color:var(--ink-3);font-size:13px;background:var(--surface-2);margin-bottom:14px;transition:.15s}
  .drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

  .list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
  .row-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px}
  .row-item:last-child{border-bottom:0}
  .row-item:active{background:var(--surface-2)}
  .ico{width:34px;height:34px;border-radius:8px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink-3);
    letter-spacing:.02em;flex:none;text-transform:uppercase}
  .ico.dir{color:var(--accent)}
  .meta{flex:1;min-width:0}
  .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
  .chip{border:1px solid var(--accent);color:var(--accent);border-radius:999px;font-size:11px;
    padding:5px 10px;font-weight:600;flex:none;letter-spacing:.04em}
  .more{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);
    font-size:19px;flex:none;border-radius:8px}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13px}

  .prog{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s ease}
  .uptxt{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:6px;display:none}
  .uptxt.on{display:block}

  /* ---------- log ---------- */
  .log{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;
    font-family:var(--mono);font-size:11.5px;color:var(--ink-2);max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  details>summary{list-style:none;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
  details>summary::-webkit-details-marker{display:none}

  /* ---------- gate ---------- */
  #gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  #gate.hidden{display:none}
  .gatebox{width:100%;max-width:320px}
  .gatebox h1{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .gatebox p{margin:0 0 22px;color:var(--ink-3);font-size:13.5px;line-height:1.6}
  #pinbox{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
  #pinbox span{width:52px;height:64px;border:1px solid var(--line-2);border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:28px;background:var(--surface)}
  #pinbox span.f{border-color:var(--accent);border-width:2px}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
  .keys button{height:54px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);
    font-size:20px;font-family:var(--mono);font-weight:500}
  .keys button:active{background:var(--surface-2)}
  .keys button.fn{font-size:13px;letter-spacing:.08em;font-family:var(--sans)}
  .err{color:var(--danger);font-size:12.5px;min-height:18px;text-align:center;margin-top:10px}

  /* ---------- sheet / viewer ---------- */
  #veil{position:fixed;inset:0;z-index:90;background:rgba(23,22,20,.28);opacity:0;pointer-events:none;transition:.18s}
  #veil.on{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--surface);
    border-top-left-radius:18px;border-top-right-radius:18px;padding:8px 14px calc(env(safe-area-inset-bottom) + 14px);
    transform:translateY(101%);transition:.22s cubic-bezier(.22,.8,.3,1)}
  #sheet.on{transform:none}
  #sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--line-2);margin:6px auto 12px}
  #sheet h3{margin:0 0 4px;font-size:16px;font-weight:600;word-break:break-all}
  #sheet .path{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:14px;word-break:break-all}
  .acts{display:flex;flex-direction:column}
  .acts button{text-align:left;padding:14px 4px;border-top:1px solid var(--line);font-size:15px;color:var(--ink)}
  .acts button.acc{color:var(--accent);font-weight:600}
  .acts button.dgr{color:var(--danger)}
  #viewer{position:fixed;inset:0;z-index:95;background:#0E0E0D;display:none;align-items:center;justify-content:center;flex-direction:column}
  #viewer.on{display:flex}
  #viewer video,#viewer img{max-width:100%;max-height:100%;display:block}
  #viewer .bar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px;color:#fff;font-size:13px;
    background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,0))}
  #viewer .bar b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #viewer .bar button{color:#fff;font-size:13px;letter-spacing:.06em}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,14px);
    z-index:120;background:var(--ink);color:#fff;font-size:13px;padding:11px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span class="mark">BoxHub</span>
  <span class="dev"><b id="dmodel">—</b><span id="dandroid">连接中</span></span>
</header>

<main>
  <!-- ================= REMOTE ================= -->
  <section>
    <div class="head">
      <h2>Remote</h2>
      <span class="sub" id="viaLabel">—</span>
    </div>

    <div class="card" style="padding:12px">
      <div class="screen" id="screen">
        <img id="shot" alt="" hidden>
        <div class="ph" id="shotPh">截屏预览不可用<br>遥控功能不受影响</div>
        <span class="age" id="shotAge" hidden></span>
      </div>
      <div class="screenbar">
        <button class="btn quiet" id="shotBtn">截屏</button>
        <button class="btn quiet" id="autoBtn">自动 · 关</button>
        <span class="hint" id="shotHint">按需</span>
      </div>
      <div class="screenbar" style="margin-top:6px">
        <span class="hint" id="kaLabel" style="margin-left:0">保持运行 —</span>
        <span class="hint" style="margin-left:auto">断线时请确认电视上的 BoxHub 仍在运行</span>
      </div>
      <!-- Why the remote is dead, in words. "遥控不可用" alone leaves the user
           with nothing to act on. -->
      <div class="note" id="remoteNote" hidden></div>
    </div>

    <div style="height:16px"></div>

    <div class="dpad">
      <span></span>
      <button class="k" data-key="19">▲</button>
      <span></span>
      <button class="k" data-key="21">◀</button>
      <button class="k ok" data-key="23">OK</button>
      <button class="k" data-key="22">▶</button>
      <span></span>
      <button class="k" data-key="20">▼</button>
      <span></span>
    </div>

    <div style="height:14px"></div>

    <div class="rows">
      <div class="row">
        <button class="k ghost" data-key="4">返回</button>
        <button class="k ghost" data-key="3">主页</button>
        <button class="k ghost" data-key="82">菜单</button>
      </div>
      <div class="row">
        <button class="k ghost" data-key="88">上一首</button>
        <button class="k ghost" data-key="85">播放 / 暂停</button>
        <button class="k ghost" data-key="87">下一首</button>
      </div>
      <div class="row">
        <button class="k ghost" data-key="86">停止</button>
        <button class="k ghost" data-key="25">音量 −</button>
        <button class="k ghost" data-key="24">音量 +</button>
      </div>
    </div>

    <div style="height:16px"></div>

    <div class="pad" id="pad">
      <div class="nub" id="nub"></div>
      <div class="tip">拖动移动焦点 · 轻点确认<br><span style="font-family:var(--mono);font-size:11px">上下左右 / OK</span></div>
    </div>

    <div class="inline">
      <input id="textIn" placeholder="输入文字后发送到盒子" autocomplete="off" enterkeyhint="send">
      <button class="btn" id="textGo">发送</button>
    </div>
  </section>

  <!-- ================= FILES ================= -->
  <section>
    <div class="head">
      <h2>Files</h2>
      <span class="sub" id="storeLabel">—</span>
    </div>

    <nav class="crumbs" id="crumbs"></nav>

    <div class="tools">
      <button class="btn" id="pickBtn">上传文件</button>
      <button class="btn quiet" id="mkdirBtn">新建目录</button>
      <button class="btn quiet" id="reloadBtn">刷新</button>
      <button class="btn quiet" id="rootBtn">根目录</button>
    </div>

    <div class="drop" id="drop">把文件拖到这里，或点「上传文件」<br><span style="font-family:var(--mono);font-size:11px">直接写入盒子本地存储</span></div>
    <input type="file" id="picker" multiple hidden>

    <div class="prog" id="prog"><i></i></div>
    <div class="uptxt" id="uptxt"></div>

    <div class="list" id="list"></div>
  </section>

  <!-- ================= LOG ================= -->
  <section>
    <details>
      <summary>System</summary>
      <div class="log" id="log">—</div>
    </details>
  </section>
</main>

<!-- ================= PIN GATE ================= -->
<!-- Starts hidden: the gate is shown only when a request actually comes back
     unauthorised, so a stored pairing code never flashes this screen. -->
<div id="gate" class="hidden">
  <div class="gatebox">
    <h1>配对码</h1>
    <p>请输入电视上 BoxHub 显示的 4 位配对码。</p>
    <div id="pinbox"><span></span><span></span><span></span><span></span></div>
    <div class="err" id="perr"></div>
    <div class="keys">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <button class="fn" data-d="clr">清除</button><button data-d="0">0</button>
      <button class="fn" data-d="del">删除</button>
    </div>
  </div>
</div>

<div id="veil"></div>
<div id="sheet">
  <div class="grab"></div>
  <h3 id="shTitle">—</h3>
  <div class="path" id="shPath"></div>
  <div class="acts" id="shActs"></div>
</div>

<div id="viewer">
  <div class="bar"><b id="vwTitle"></b><button id="vwClose">关闭</button></div>
  <video id="vwVideo" controls playsinline></video>
  <img id="vwImg" alt="" hidden>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
var KEY = sessionStorage.getItem('boxhub_key') || '';
var info = null;
var cwd  = '';
var autoShot = false, shotTimer = null, ws = null, wsBackoff = 1000;

var KC = { UP:19, DOWN:20, LEFT:21, RIGHT:22, OK:23, BACK:4, HOME:3 };

var VIDEO = ['mp4','m4v','mkv','webm','avi','mov','ts','m2ts','flv','wmv','rmvb','rm'];
var IMAGE = ['jpg','jpeg','png','gif','webp','bmp','svg','heic'];
var AUDIO = ['mp3','m4a','flac','wav','aac','ogg','wma'];
var TEXTY = ['txt','log','srt','ass','vtt','nfo','json','xml'];

var $  = function(s){ return document.querySelector(s); };
var el = function(t,c){ var e=document.createElement(t); if(c) e.className=c; return e; };

function q(path, extra){
  var s = 'k=' + encodeURIComponent(KEY);
  if(extra) { for(var k in extra){ if(extra[k]!==undefined && extra[k]!==null) s += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(extra[k]); } }
  return path + (path.indexOf('?') >= 0 ? '&' : '?') + s;
}
function seg(p){ return String(p).split('/').filter(function(s){return s.length;}).map(encodeURIComponent).join('/'); }
function dlUrl(rel){ return '/dl/' + seg(rel) + '?k=' + encodeURIComponent(KEY); }

function toast(msg, ms){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('on'); }, ms || 1900);
}

function api(path, params){
  return fetch(q(path, params), { cache:'no-store' }).then(function(r){
    return r.json().then(function(j){
      if(r.status === 401){ j.__unauth = true; }
      if(!r.ok || j.__unauth){ throw new Error(j.error || ('HTTP ' + r.status)); }
      return j;
    });
  });
}

/* ------------------------------------------------------------------ *
 * PIN gate
 * ------------------------------------------------------------------ */
var pinVal = '';
function paintPin(){
  var spans = $('#pinbox').children;
  for(var i=0;i<4;i++){
    spans[i].textContent = pinVal[i] || '';
    spans[i].classList.toggle('f', i === pinVal.length);
  }
}
function pushDigit(d){
  if(pinVal.length >= 4) return;
  pinVal += d; paintPin(); $('#perr').textContent = '';
  if(pinVal.length === 4) setTimeout(submitPin, 140);
}
function submitPin(){
  // Verify the code that was just typed, not the stored KEY — otherwise the
  // first attempt always sends an empty key and the pair can never succeed.
  var prev = KEY;
  KEY = pinVal;
  return api('/api/info', {}).then(function(){
    sessionStorage.setItem('boxhub_key', KEY);
    pinVal = ''; paintPin();
    $('#gate').classList.add('hidden');
    boot();
  }).catch(function(e){
    KEY = prev;
    sessionStorage.removeItem('boxhub_key');
    // "Wrong code" and "could not reach the box" need different advice. Telling
    // someone the code is wrong when the box is simply unreachable sends them
    // round a loop retyping a perfectly correct number.
    $('#perr').textContent = isAuthError(e)
      ? '配对码不正确，请对照电视上的数字'
      : '连不上盒子，请确认电视上的 BoxHub 仍在运行';
    pinVal = ''; paintPin();
  });
}
/**
 * Raises the gate. Every caller gets here because the server just refused the
 * code in hand, so the code is dropped here rather than in each caller: leaving
 * a known-dead key in sessionStorage meant the next page load booted straight
 * back into a failing session instead of asking for the new code.
 */
function requirePin(){
  KEY = '';
  sessionStorage.removeItem('boxhub_key');
  pinVal = ''; paintPin();
  $('#gate').classList.remove('hidden');
  $('#perr').textContent = '';
}
paintPin();

// Wire the keypad. Without this the gate renders but does nothing, and the
// pairing code could not be entered at all.
Array.prototype.forEach.call(document.querySelectorAll('.keys button'), function(b){
  var d = b.getAttribute('data-d') || '';
  b.addEventListener('click', function(){
    if (d === 'clr') { pinVal = ''; $('#perr').textContent = ''; paintPin(); return; }
    if (d === 'del') { pinVal = pinVal.slice(0, -1); paintPin(); return; }
    if (/^[0-9]$/.test(d)) pushDigit(d);
  });
});

// Also accept a physical keyboard while the gate is up.
document.addEventListener('keydown', function(e){
  if ($('#gate').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') { pushDigit(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { pinVal = pinVal.slice(0, -1); paintPin(); e.preventDefault(); }
  else if (e.key === 'Enter' && pinVal.length === 4) { submitPin(); e.preventDefault(); }
});

/* ------------------------------------------------------------------ *
 * Remote
 * ------------------------------------------------------------------ */
function sendKey(code){
  return fetch(q('/api/key', { code: code }), { method:'POST' })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function(j){
      $('#viaLabel').textContent = j.via || '—';
      if(!j.ok) toast('本机固件拒绝注入按键');
      return j;
    })
    .catch(function(){ toast('发送失败'); });
}
function holdRepeat(el, code){
  var t1 = null, t2 = null, sent = false;
  function stop(){
    clearTimeout(t1); clearInterval(t2); t1 = t2 = null;
  }
  el.addEventListener('pointerdown', function(e){
    e.preventDefault();
    sent = true;
    sendKey(code);
    t1 = setTimeout(function(){ t2 = setInterval(function(){ sendKey(code); }, 190); }, 420);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    el.addEventListener(ev, stop);
  });
  // Keyboard and assistive-technology activation produce a click with no
  // pointer events at all, so the repeat binding alone would leave these two
  // buttons dead for those users.
  el.addEventListener('click', function(){
    if (!sent) sendKey(code);
    sent = false;
  });
}

Array.prototype.forEach.call(document.querySelectorAll('.k[data-key]'), function(b){
  var code = parseInt(b.getAttribute('data-key'), 10);
  if(code === 24 || code === 25) holdRepeat(b, code);
  else b.addEventListener('click', function(){ sendKey(code); });
});

/* touchpad ------------------------------------------------------------ */
(function(){
  var pad = $('#pad'), nub = $('#nub'), tip = pad.querySelector('.tip');
  var STEP = 46, active = false, sx = 0, sy = 0, acc = 0, moved = 0, pid = null;

  function begin(e){
    if(pid !== null) return;
    pid = e.pointerId;
    try{ pad.setPointerCapture(pid); }catch(_){}
    var r = pad.getBoundingClientRect();
    sx = e.clientX - r.left; sy = e.clientY - r.top;
    acc = 0; moved = 0; active = true;
    nub.style.display = 'block';
    nub.style.left = (sx - 8) + 'px';
    nub.style.top  = (sy - 8) + 'px';
    tip.style.opacity = '.25';
  }
  function move(e){
    if(!active || e.pointerId !== pid) return;
    var r = pad.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var dx = x - sx, dy = y - sy;
    moved = Math.max(moved, Math.hypot(dx, dy));
    nub.style.left = (x - 8) + 'px';
    nub.style.top  = (y - 8) + 'px';
    acc += Math.hypot(dx, dy) * 0 + Math.abs(dx) + Math.abs(dy) * 0 + (Math.abs(dx) > Math.abs(dy) ? Math.abs(dx) : Math.abs(dy));
    if(acc >= STEP){
      var k = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? KC.RIGHT : KC.LEFT) : (dy > 0 ? KC.DOWN : KC.UP);
      sendKey(k);
      acc = 0;
    }
  }
  function end(e){
    if(e.pointerId !== pid) return;
    active = false; pid = null;
    nub.style.display = 'none';
    tip.style.opacity = '1';
    if(moved < 12) sendKey(KC.OK);
  }
  pad.addEventListener('pointerdown', begin);
  pad.addEventListener('pointermove', move);
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
})();

var shotAt = 0;

  img.onload = function(){

/* ------------------------------------------------------------------ *
 * Files
 * ------------------------------------------------------------------ */
function human(n){
  if(!n) return '0 B';
  var u = ['B','KB','MB','GB','TB'], i = 0, v = n;
  while(v >= 1024 && i < u.length-1){ v /= 1024; i++; }
  return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
}
function when(ms){
  if(!ms) return '';
  var d = new Date(ms), now = new Date();
  var p = function(x){ return x < 10 ? '0'+x : ''+x; };
  var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  return sameDay ? p(d.getHours())+':'+p(d.getMinutes())
                 : (d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function icon(ext, isDir){
  if(isDir) return {t:'DIR', c:'dir'};
  if(ext === 'apk') return {t:'APK', c:''};
  if(VIDEO.indexOf(ext) >= 0) return {t:'VID', c:''};
  if(IMAGE.indexOf(ext) >= 0) return {t:'IMG', c:''};
  if(AUDIO.indexOf(ext) >= 0) return {t:'AUD', c:''};
  if(TEXTY.indexOf(ext) >= 0) return {t:'TXT', c:''};
  return {t:(ext || '?').slice(0,3), c:''};
}

function paintCrumbs(path){
  var c = $('#crumbs');
  c.innerHTML = '';
  var root = el('button'); root.textContent = 'SD'; root.onclick = function(){ load(''); };
  c.appendChild(root);
  var parts = path.split('/').filter(Boolean), acc = '';
  parts.forEach(function(p, i){
    acc = acc ? acc + '/' + p : p;
    var s = el('span', 'sepc'); s.textContent = '/'; c.appendChild(s);
    var b = el('button');
    b.textContent = p;
    if(i === parts.length-1) b.className = 'cur';
    else b.onclick = (function(t){ return function(){ load(t); }; })(acc);
    c.appendChild(b);
  });
}

function paintList(items){
  var box = $('#list');
  box.innerHTML = '';
  if(!items.length){
    box.appendChild(el('div', 'empty')).textContent = '这个目录是空的';
    return;
  }
  items.forEach(function(it){
    var full = cwd ? cwd + '/' + it.name : it.name;
    var row = el('div', 'row-item');

    var ic = el('div', 'ico ' + icon(it.ext, it.dir).c);
    ic.textContent = icon(it.ext, it.dir).t;

    var meta = el('div', 'meta');
    var nm = el('div', 'nm'); nm.textContent = it.name;
    var sb = el('div', 'sb');
    sb.textContent = it.dir ? '目录 · ' + when(it.mtime) : human(it.size) + ' · ' + when(it.mtime);
    meta.appendChild(nm); meta.appendChild(sb);

    row.appendChild(ic); row.appendChild(meta);

    if(it.apk){
      var chip = el('button', 'chip'); chip.textContent = '安装';
      chip.onclick = function(ev){ ev.stopPropagation(); doInstall(full, it.name); };
      row.appendChild(chip);
    }

    var more = el('button', 'more'); more.textContent = '⋯';
    more.onclick = function(ev){ ev.stopPropagation(); openSheet(full, it); };
    row.appendChild(more);

    row.onclick = function(){ it.dir ? load(full) : openFile(full, it); };
    box.appendChild(row);
  });
}

function load(path){
  cwd = path || '';
  api('/api/list', { path: cwd }).then(function(j){
    paintCrumbs(j.path);
    paintList(j.items);
    $('#storeLabel').textContent = j.storage;
  }).catch(function(e){
    if (isAuthError(e)) requirePin(); else toast(e.message);
  });
}
$('#reloadBtn').addEventListener('click', function(){ load(cwd); });
$('#rootBtn').addEventListener('click', function(){ load(''); });

function openFile(rel, it){
  var e = it.ext || '';
  if(VIDEO.indexOf(e) >= 0 || AUDIO.indexOf(e) >= 0) return viewMedia(rel, it.name);
  if(IMAGE.indexOf(e) >= 0) return viewImage(rel, it.name);
  if(e === 'apk') return openSheet(rel, it);
  openSheet(rel, it);
}

/* sheet ---------------------------------------------------------------- */
var sheetTarget = null;
function openSheet(rel, it){
  sheetTarget = { rel: rel, it: it };
  $('#shTitle').textContent = it.name;
  $('#shPath').textContent = (info ? info.root : '') + '/' + rel;
  var acts = $('#shActs');
  acts.innerHTML = '';

  function add(label, cls, fn){
    var b = el('button', cls); b.textContent = label;
    b.onclick = function(){ closeSheet(); fn(); };
    acts.appendChild(b);
  }

  var e = it.ext || '';
  if(!it.dir && (VIDEO.indexOf(e) >= 0 || AUDIO.indexOf(e) >= 0)) add('播放', 'acc', function(){ viewMedia(rel, it.name); });
  if(!it.dir && IMAGE.indexOf(e) >= 0) add('预览', 'acc', function(){ viewImage(rel, it.name); });
  if(it.apk) add('安装到盒子', 'acc', function(){ doInstall(rel, it.name); });
  add('重命名', '', function(){ promptName('重命名', it.name, function(nn){ api('/api/rename', { path: rel, name: nn }).then(function(){ load(cwd); toast('已重命名'); }); }); });
  add('下载链接', '', function(){ var u = location.origin + dlUrl(rel); promptName('下载链接', u, function(){}, true); });
  if(it.dir) add('删除目录', 'dgr', function(){ confirmDestructive('删除目录', rel, it.name, '会同时永久删除该目录下的全部内容。', function(){ runDelete(rel, true); }); });
  else add('删除', 'dgr', function(){ runDelete(rel, false); });

  $('#veil').classList.add('on');
  $('#sheet').classList.add('on');
}

function runDelete(rel, isDir){
  api('/api/delete', { path: rel }).then(function(j){
    load(cwd);
    toast(j.dir ? '已删除 ' + j.name + '（' + j.entries + ' 项）' : '已删除');
  }).catch(function(e){ toast(e.message, 2600); });
}

/** Two-step destructive confirmation; the sheet's primary action is never a bare delete. */
function confirmDestructive(title, rel, name, message, onOk){
  $('#shTitle').textContent = title;
  $('#shPath').textContent = name;
  var acts = $('#shActs');
  acts.innerHTML = '';
  var warn = el('div');
  warn.textContent = message;
  warn.style.cssText = 'font-size:13.5px;color:var(--ink-2);line-height:1.6;padding:2px 4px 14px';
  acts.appendChild(warn);
  function add(label, cls, fn){
    var b = el('button', cls); b.textContent = label;
    b.onclick = function(){ closeSheet(); fn(); };
    acts.appendChild(b);
  }
  add('取消', '', function(){});
  add('确认删除', 'dgr', onOk);
  $('#veil').classList.add('on');
  $('#sheet').classList.add('on');
}
function closeSheet(){ $('#veil').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#veil').addEventListener('click', closeSheet);

function promptName(title, initial, done, readOnly){
  var val = initial;
  var inp = el('input');
  inp.value = val;
  inp.style.cssText = 'width:100%;margin-bottom:12px;padding:12px;border:1px solid var(--line-2);border-radius:10px;outline:none';
  if(readOnly){ inp.readOnly = true; inp.style.fontFamily = 'var(--mono)'; inp.style.fontSize = '12px'; }
  $('#shTitle').textContent = title;
  $('#shPath').textContent = '';
  var acts = $('#shActs'); acts.innerHTML = '';
  acts.appendChild(inp);
  function add(label, cls, fn){
    var b = el('button', cls); b.textContent = label;
    b.onclick = function(){ closeSheet(); fn(inp.value.trim()); };
    acts.appendChild(b);
  }
  add('取消', '', function(){});
  add('确定', 'acc', function(v){ if(!readOnly && !v) return; done(v); });
  $('#veil').classList.add('on');
  $('#sheet').classList.add('on');
  if(!readOnly) setTimeout(function(){ inp.focus(); inp.select(); }, 120);
}

/* upload --------------------------------------------------------------- */
function doUpload(files){
  if(!files || !files.length) return;
  var i = 0;
  (function next(){
    if(i >= files.length){
      $('#prog').classList.remove('on');
      $('#uptxt').classList.remove('on');
      load(cwd);
      toast('上传完成');
      return;
    }
    var f = files[i++];
    var xhr = new XMLHttpRequest();
    var prog = $('#prog'), bar = prog.querySelector('i'), txt = $('#uptxt');
    prog.classList.add('on'); txt.classList.add('on');
    txt.textContent = '上传 ' + f.name + ' · ' + human(f.size);
    xhr.open('PUT', q('/api/upload', { path: cwd, name: f.name }), true);
    xhr.upload.onprogress = function(ev){
      if(!ev.lengthComputable) return;
      var pct = Math.round(ev.loaded / ev.total * 100);
      bar.style.width = pct + '%';
      txt.textContent = '上传 ' + f.name + ' · ' + pct + '% · ' + human(ev.loaded) + ' / ' + human(ev.total);
    };
    xhr.onload = function(){
      if(xhr.status === 401) return requirePin();
      var ok = false;
      try { ok = JSON.parse(xhr.responseText).ok; } catch(_){}
      txt.textContent = ok ? f.name + ' 完成' : f.name + ' 失败';
      setTimeout(next, ok ? 260 : 900);
    };
    xhr.onerror = function(){ txt.textContent = f.name + ' 失败'; setTimeout(next, 900); };
    xhr.send(f);
  })();
}

$('#pickBtn').addEventListener('click', function(){ $('#picker').click(); });
$('#picker').addEventListener('change', function(e){ doUpload(e.target.files); e.target.value = ''; });
$('#mkdirBtn').addEventListener('click', function(){
  promptName('新建目录', '', function(nn){
    if(!nn) return;
    api('/api/mkdir', { path: cwd, name: nn }).then(function(){ load(cwd); toast('已创建'); }).catch(function(e){ toast(e.message); });
  });
});

(function(){
  var drop = $('#drop'), depth = 0;
  ['dragenter','dragover'].forEach(function(ev){
    document.addEventListener(ev, function(e){
      if(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0){
        e.preventDefault();
        if(ev === 'dragenter') depth++;
        drop.classList.add('hot');
      }
    });
  });
  document.addEventListener('dragleave', function(){ if(--depth <= 0){ depth = 0; drop.classList.remove('hot'); } });
  document.addEventListener('drop', function(e){
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      e.preventDefault();
      depth = 0; drop.classList.remove('hot');
      doUpload(e.dataTransfer.files);
    }
  });
})();

/* ------------------------------------------------------------------ *
 * WebSocket + polling fallback
 * ------------------------------------------------------------------ */
function logline(s){
  var box = $('#log');
  if(box.textContent === '—') box.textContent = '';
  box.textContent += s + '\n';
  box.scrollTop = box.scrollHeight;
}

function wsOpen(){
  if(!KEY) return;
  // Drop the previous socket first. Leaving it alive let its late
  // `unauthorized` frame land on top of a freshly paired session and slam the
  // gate back up — the same stale-response race that was removed from boot(),
  // still reachable through the socket.
  if(ws){
    try { ws.onclose = null; ws.onmessage = null; ws.close(); }catch(_){}
    ws = null;
  }
  var key = KEY, sock;
  try{
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    sock = new WebSocket(proto + '//' + location.host + '/ws?k=' + encodeURIComponent(key));
  } catch(e){ return wsPoll(); }
  ws = sock;

  // Every handler ignores a socket that is no longer the live one, so a socket
  // replaced mid-handshake cannot mutate the current session's state.
  function current(){ return ws === sock; }

  sock.onopen = function(){
    if(!current()) return;
    wsBackoff = 1000;
    if(wsPollTimer){ clearInterval(wsPollTimer); wsPollTimer = null; }
    setDot('on');
    try{ sock.send('info'); }catch(_){}
  };
  sock.onmessage = function(ev){
    if(!current()) return;
    var j;
    try { j = JSON.parse(ev.data); } catch(_){ return; }
    if(j.event === 'unauthorized') return requirePin();
    if(j.event === 'hello' || j.event === 'info'){
      applyInfo(j.data);
      try{ sock.send('logs'); }catch(_){}
    } else if(j.event === 'logs'){
      $('#log').textContent = (j.data || []).join('\n') || '—';
      var b = $('#log'); b.scrollTop = b.scrollHeight;
    } else if(j.event === 'log'){
      logline(j.line);
    } else if(j.event === 'upload'){
      if(!cwd) load('');
    }
  };
  sock.onclose = function(){
    if(!current()) return;
    setDot('off');
    ws = null;
    wsDown();
  };
  sock.onerror = function(){ try{ sock.close(); }catch(_){} };
}

/**
 * Socket dropped: poll so the dashboard keeps working, and keep retrying the
 * socket with a growing delay. Without the retry a single dropped connection
 * left the page on the polling path for the rest of its life.
 */
var wsRetryTimer = null;
function wsDown(){
  wsPoll();
  if(wsRetryTimer) return;
  var wait = wsBackoff;
  wsRetryTimer = setTimeout(function(){
    wsRetryTimer = null;
    if(ws || !KEY) return;
    wsBackoff = Math.min(wsBackoff * 2, 15000);
    wsOpen();
  }, wait);
}
// One keepalive for the whole page. Creating it inside wsOpen() leaked a new
// interval on every reconnect, each one pinging whatever socket it closed over.
setInterval(function(){
  if(ws && ws.readyState === 1){ try{ ws.send('ping'); }catch(_){} }
}, 20000);

// The polling fallback keeps its own handle. It used to hang the timer off the
// socket, and the close handler nulled that socket before calling in here — so
// the documented "断线自动降级为 3 秒轮询" recovery died with a TypeError on the
// exact moment it was needed, leaving the dashboard permanently disconnected.
var wsPollTimer = null;
function pollOnce(){
  if(ws) return;
  var key = KEY;
  if(!key) return;
  fetch(q('/api/info'), { cache:'no-store' })
    .then(function(r){ return r.status === 401 ? Promise.reject('auth') : r.json(); })
    .then(function(j){
      if(KEY !== key) return;
      setDot('on');
      applyInfo(j);
    })
    .catch(function(e){
      if(e === 'auth'){
        // The TV rotated its code. Forget the dead one and offer the gate, but
        // only if this is still the code in play: a response that predates a
        // successful re-pair must never re-open the gate on a live session.
        if(KEY !== key) return;
        setDot('off');
        requirePin();
        return;
      }
      setDot('off');
    });
}
function wsPoll(){
  if(wsPollTimer) clearInterval(wsPollTimer);
  wsPollTimer = setInterval(pollOnce, 3000);
}

function setDot(cls){
  var d = $('#dot');
  d.className = 'dot' + (cls === 'on' ? ' on' : cls === 'off' ? ' off' : '');
}

function applyInfo(j){
  info = j;
  $('#dmodel').textContent = j.model || '—';
  $('#dandroid').textContent = (j.android || '') + (j.remoteOk ? '' : ' · 遥控不可用');
  $('#viaLabel').textContent = j.remote || '—';
  $('#storeLabel').textContent = j.storage || '—';
  if(j.remote && !j.remoteOk){
    $('#viaLabel').textContent = '不可用';
  }
  // A dead remote is the difference between "app is broken" and "this Android
  // build forbids key injection from a normal app", so say the second one.
  var note = $('#remoteNote');
  if(j.remoteOk === false){
    var why = j.shellDetail || '本机拒绝注入按键。';
    var html = '<b>遥控不可用：</b>' + escapeHtml(why) +
      '<br>Android 把「注入按键」设为签名级权限，普通 App 一律被拒 —— 这是系统限制，' +
      '不是应用故障。文件管理、播放、装包都照常可用。' +
      '<br>要用遥控，需要满足一条：给盒子 root（本页下方「root (su)」会变成 ✓，遥控自动恢复）' +
      ' / 把 BoxHub 装成系统应用 / 电脑上用 adb shell input。';
    // The raw framework message is kept, but out of the way: it is truncated
    // mid-sentence and means nothing to a reader.
    if(j.remoteWhy) html += '<details style="margin-top:7px"><summary style="font-size:11px">技术细节</summary>' +
      '<div style="margin-top:5px;font-family:var(--mono);font-size:10.5px;word-break:break-word">' +
      escapeHtml(j.remoteWhy) + '</div></details>';
    note.innerHTML = html;
    note.hidden = false;
  } else {
    note.hidden = true;
  }
  if(!j.capture){
    $('#shotPh').innerHTML = '截屏预览不可用<br><span style="font-size:11px">' +
      (j.captureError || 'screencap 被拒绝') + '</span><br>遥控功能不受影响';
  }
  // Surface whether the box's keep-alive is on, so a dropped connection has a
  // plausible explanation instead of just a red dot.
  if (j.keepAlive !== undefined){
    var ka = $('#kaLabel');
    ka.textContent = j.keepAlive ? '保持运行 已开启' : '保持运行 未开启';
    ka.style.color = j.keepAlive ? 'var(--accent)' : 'var(--ink-3)';
  }
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
function boot(){
  refreshShot();
  load('');
  wsOpen();
  api('/api/info', {}).then(applyInfo).catch(function(e){
    if (isAuthError(e)) requirePin();
  });
}

function isAuthError(e){ return /unauthorized|401/i.test(String((e && e.message) || e)); }

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

// Single authentication path. A separate load-time probe used to race the
// pairing attempt: if its 401 landed after a successful pairing it re-opened
// the gate on top of a live session. Boot() already probes and calls
// requirePin() itself, so there is exactly one request and no ordering hazard.
if (KEY) boot();
else requirePin();

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeSheet(); closeViewer(); }
});

})();
</script>
